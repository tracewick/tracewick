name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Nightly run of the full matrix.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pull requests run on this single PHP version to save Actions minutes.
  PR_PHP_VERSION: '8.4'
  INFECTION_VERSION: '0.35.8'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PR_PHP_VERSION }}
          extensions: excimer
          coverage: pcov
          # Infection is a PHAR, not a dev dependency: recent versions need PHP 8.3+ and would
          # block installing dependencies on PHP 8.2 in the matrix.
          tools: composer:v2, infection:${{ env.INFECTION_VERSION }}

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4
        id: install

      - name: Normalize composer.json
        # Run every check even if an earlier one fails, so one push shows all problems.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer normalize:check

      - name: Coding style
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer cs:check

      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer rector:check

      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer stan -- --error-format=github

      - name: Dependency analysis
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer deps

      - name: Tests with coverage
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage gates are enforced by Codecov's status checks, not by this upload.
          fail_ci_if_error: false

      - name: Mutation testing
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          # Infection aborts when the tests execute no source statement at all, which is the case
          # while src/ holds only exceptions and interfaces. Remove this guard once it never fires.
          if tail -n 3 build/coverage/clover.xml | grep -q ' statements="0"'; then
            echo '::notice::No executable source code yet, skipping mutation testing.'
            exit 0
          fi
          composer infection:ci

      - name: Security audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer audit

  matrix:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    # The full matrix only runs on main, develop, nightly and on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: excimer
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        run: composer test
