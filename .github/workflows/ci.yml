name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Nightly run of the full matrix.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Heavy Checks job (coverage, Infection, stan) stays on one PHP version.
  PR_PHP_VERSION: '8.5'
  INFECTION_VERSION: '0.35.8'

jobs:
  release-check:
    name: Release packaging (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No publishing or OIDC permissions; fixtures are explicitly unsigned.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify the actual exported package
        run: |
          python3 scripts/release-package.py --output build/release --version 0.0.0-snapshot
          (cd build/release && sha256sum --check checksums.txt)
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate the package SBOM against CycloneDX 1.6
        run: |
          python3 -m pip install 'jsonschema==4.26.0'
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          from jsonschema import Draft7Validator
          from referencing import Registry, Resource
          registry = Registry()
          base = 'https://raw.githubusercontent.com/CycloneDX/specification/55343ba19dee1785acf1ce9191540d5fd7b590db/schema/'
          for name in ('bom-1.6.schema.json', 'spdx.schema.json', 'jsf-0.82.schema.json'):
              with urllib.request.urlopen(base + name, timeout=30) as stream:
                  document = json.load(stream)
              resource = Resource.from_contents(document)
              for prefix in ('http://cyclonedx.org/schema/', 'https://cyclonedx.org/schema/'):
                  registry = registry.with_resource(prefix + name, resource)
              if name == 'bom-1.6.schema.json':
                  schema = document
          bom = json.loads(pathlib.Path('build/release/tracewick-0.0.0-snapshot.sbom.json').read_text())
          Draft7Validator(schema, registry=registry).validate(bom)
          PY

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PR_PHP_VERSION }}
          extensions: excimer
          coverage: pcov
          # Infection is a PHAR, not a dev dependency: recent versions need PHP 8.3+ and would
          # block installing dependencies on PHP 8.2 in the matrix.
          tools: composer:v2, infection:${{ env.INFECTION_VERSION }}

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4
        id: install

      - name: Normalize composer.json
        # Run every check even if an earlier one fails, so one push shows all problems.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer normalize:check

      - name: Coding style
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer cs:check

      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer rector:check

      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer stan -- --error-format=github

      - name: Dependency analysis
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer deps

      - name: Tests with coverage
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test:coverage

      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          go-version: stable
          cache: false

      - name: Validate pprof golden files with go tool pprof
        # The golden tests pin the encoder output; this checks that the reference parser reads it.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          for file in tests/Unit/Encoder/golden/*.pb; do
            echo "::group::$file"
            go tool pprof -raw "$file"
            echo '::endgroup::'
          done

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage gates are enforced by Codecov's status checks, not by this upload.
          fail_ci_if_error: false

      - name: Mutation testing
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          # Safety net if coverage is empty (misconfigured run). Normal builds have executable src/.
          if tail -n 3 build/coverage/clover.xml | grep -q ' statements="0"'; then
            echo '::notice::Coverage reports zero statements; skipping mutation testing.'
            exit 0
          fi
          composer infection:ci

      - name: Security audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer audit

  matrix:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    # Full PHP × dependency matrix on every PR and on main/develop pushes (public repo).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.php == '8.6' && ':excimer, mbstring, dom' || 'excimer' }}
          coverage: none
          tools: ${{ matrix.php == '8.6' && 'composer:v2, pie' || 'composer:v2' }}

      # Same pending release pin as the stand; blocked until 1.2.8 is published.
      - name: Install Excimer on PHP 8.6
        if: ${{ matrix.php == '8.6' }}
        run: |
          # setup-php links INI files across SAPIs; let only one CLI file enable Excimer.
          sudo pie install 'wikimedia/excimer:1.2.8' --auto-install-build-tools --skip-enable-extension
          printf 'extension=excimer.so\n' | sudo tee /etc/php/8.6/cli/conf.d/30-tracewick-excimer.ini

      - name: Require real Excimer integration coverage
        run: |
          php -r 'exit(extension_loaded("excimer") ? 0 : 1);'

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        run: composer test
