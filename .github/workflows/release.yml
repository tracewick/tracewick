name: Release

# Git flow releases: a release/* branch is merged into main, then release-please opens a release
# pull request into main with the changelog and version. Merging that pull request tags vX.Y.Z and
# publishes the GitHub Release; this workflow then opens a pull request merging main back into
# develop. Packagist picks up the tag through its GitHub webhook.
#
# The workflow acts as the tracewick-release GitHub App when RELEASE_APP_ID (repository variable)
# and RELEASE_APP_PRIVATE_KEY (secret) are set, so that the App can bypass the tag ruleset and its
# pull requests trigger CI. Without them it falls back to GITHUB_TOKEN. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing tag whose release assets should be built or recovered
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Get a GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  release-assets:
    name: Signed package assets
    needs: release-please
    if: ${{ always() && !cancelled() && github.repository == 'tracewick/tracewick' && github.ref == 'refs/heads/main' && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.publish_tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Require tagged main source with signed-release support
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test -f scripts/release-package.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Build and sign release assets
        run: |
          python3 scripts/release-package.py --output build/release \
            --version "${RELEASE_TAG#v}" --ref "$RELEASE_TAG"
          cosign sign-blob --yes --bundle build/release/checksums.txt.sigstore.json \
            build/release/checksums.txt
      - name: Get a release-asset upload token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish and verify downloaded assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          ASSETS=build/release
          PREFIX="tracewick-${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$ASSETS/$PREFIX.zip" "$ASSETS/$PREFIX.sbom.json" \
            "$ASSETS/checksums.txt" "$ASSETS/checksums.txt.sigstore.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-verification" \
            --pattern "$PREFIX.zip" --pattern "$PREFIX.sbom.json" \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json
          cd "$RUNNER_TEMP/release-verification"
          cosign verify-blob \
            --certificate-identity 'https://github.com/tracewick/tracewick/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle checksums.txt.sigstore.json checksums.txt
          sha256sum --check checksums.txt

  back-merge:
    name: Merge main back into develop
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Get a GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open a back-merge pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: merge $TAG back into develop" \
            --body "Brings the changelog and version of $TAG from main back into develop. Merge with a merge commit, not a squash."
