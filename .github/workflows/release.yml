name: Release

# Git flow releases: a release/* branch is merged into main, then release-please opens a release
# pull request into main with the changelog and version. Merging that pull request tags vX.Y.Z and
# publishes the GitHub Release; this workflow then opens a pull request merging main back into
# develop. Packagist picks up the tag through its GitHub webhook.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  back-merge:
    name: Merge main back into develop
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Open a back-merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: merge $TAG back into develop" \
            --body "Brings the changelog and version of $TAG from main back into develop. Merge with a merge commit, not a squash."
