name: Stand

# Builds the docker-compose development stand and runs the test suites inside it. Runs when the
# stand, Composer layout, or any library `src/` / integration tests change (ext-excimer matrix).

on:
  pull_request:
    paths:
      - compose.yaml
      - docker/**
      - Makefile
      - .github/workflows/stand.yml
      # Library code under test inside the stand (ext-excimer + real backends / Toxiproxy).
      - src/**
      - tests/Integration/**
      - tests/Support/Toxiproxy.php
      - composer.json
      - bin/**
  push:
    branches: [main, develop]
    paths:
      - compose.yaml
      - docker/**
      - Makefile
      - .github/workflows/stand.yml
      - src/**
      - tests/Integration/**
      - tests/Support/Toxiproxy.php
      - composer.json
      - bin/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stand:
    name: Stand (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build one PHP version; main, develop and manual runs build all of them.
        php: ${{ github.event_name == 'pull_request' && fromJSON('["8.5"]') || fromJSON('["8.2", "8.3", "8.4", "8.5"]') }}
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the PHP image
        run: make stand-build

      - name: Start the stand
        run: make stand-up

      - name: Smoke test
        run: make stand-smoke

      - name: Tests inside the stand
        run: make stand-test

      - name: Show service logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stand
        if: ${{ always() }}
        run: make stand-down

  # Next PHP RC (Docker Hub `php:8.6-rc-*`). Does not block merges: Excimer may need
  # `dev-master` until a release builds on 8.6, and composer.json does not claim ~8.6.0 yet.
  stand-php-rc:
    name: Stand (PHP 8.6-rc, experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      PHP_VERSION: 8.6-rc
    steps:
      - uses: actions/checkout@v7

      - name: Build the PHP 8.6 RC image
        run: make stand-build

      - name: Start the stand
        run: make stand-up

      - name: Smoke test
        run: make stand-smoke

      - name: Tests inside the stand
        run: make stand-test

      - name: Show service logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stand
        if: ${{ always() }}
        run: make stand-down
