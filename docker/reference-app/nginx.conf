server {
    listen 80;
    server_name _;
    root /srv/app/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # The PHP files live in the FPM container under the same path.
        fastcgi_param SCRIPT_FILENAME /srv/app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/app/public;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
